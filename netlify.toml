# Disable browser caching of report HTML so live updates appear immediately on hard-refresh.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Legacy URL still works — redirect old bookmarks to the new file.
[[redirects]]
  from = "/report_out.html"
  to = "/dashboard.html"
  status = 301
  force = true
